<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalat Dulu Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-accent: 'Outfit', var(--font-primary);
      --bg-glass: rgba(22, 22, 28, 0.55);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);
      --text-accent: #FFD60A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      cursor: default;
    }

    body {
      font-family: var(--font-primary);
      background: transparent;
      color: var(--text-primary);
      width: 250px;
      height: 105px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
    }

    /* Draggable Main Container */
    .widget-container {
      width: 100%;
      height: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      -webkit-app-region: drag; /* Allows the entire widget to be dragged */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.1);
      transition: border-color 0.2s;
    }

    .widget-container:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Close Button (visible on hover) */
    .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, background-color 0.1s;
      -webkit-app-region: no-drag; /* Exclude from drag so it is clickable */
    }

    .widget-container:hover .close-btn {
      opacity: 1;
    }

    .close-btn:hover {
      background: rgba(255, 69, 58, 0.8);
      color: white;
    }

    .close-btn svg {
      stroke: currentColor;
    }

    /* Widget Elements */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .clock-display {
      font-family: var(--font-accent);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1;
    }

    .location-display {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      margin-top: 2px;
    }

    .bottom-row {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .countdown-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .countdown-timer {
      font-family: var(--font-accent);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-accent);
      letter-spacing: -0.1px;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .prayer-name {
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <button class="close-btn" id="btn-close-widget" title="Sembunyikan Widget">
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    
    <div class="top-row">
      <div id="widget-clock" class="clock-display">00:00</div>
      <div id="widget-location" class="location-display">Banda Aceh</div>
    </div>
    
    <div class="bottom-row">
      <div id="widget-label" class="countdown-label">Menghitung...</div>
      <div class="countdown-timer">
        <span id="widget-prayer-name" class="prayer-name">--</span>
        <span id="widget-countdown">--:--:--</span>
      </div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
